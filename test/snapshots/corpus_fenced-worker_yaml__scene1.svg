<svg xmlns="http://www.w3.org/2000/svg" viewBox="-313 -193 1366 820" role="img" aria-label="The api rotates an event once a minute. The ledger copies its config once a minute. The metrics writes a message and moves on. The planner compares the backup and moves on. The stream starts the result when it is ready. The config opens the next batch and moves on. The dashboard picks up a snapshot on the next step. The mailer opens a message from the store. The policy opens the queue on the next step. The runner collects the result from the store. The planner copies a message on the next step. The parser checks its token and moves on. The feed stops the next batch on the next step. The standby checks the result from the store." data-scene="scene1">
