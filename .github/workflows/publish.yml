# Publishes @johnoscott/isometric-engine to npm from a release tag (v*), by npm's trusted publishing (OIDC): no token
# is stored anywhere; npm gives this one run a short-lived credential, and the package gets provenance.
#
# The guard: the tag is made only after the release is verified, and its message carries the verified package's
# sha256 ("package-sha256: <hex>"). This job builds the package from the tagged tree and publishes it only if the
# checksum is exactly that one. If the version is already on npm, it publishes nothing and checks the build against
# the registry's copy instead (so re-running it on an old tag proves the build is reproducible here).
# Actions are pinned by commit SHA, as in ci.yml; dependencies install with no scripts. Whoever may push a v* tag to this
# repository may publish: keep tag pushes to the owner.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A release tag to check (it publishes only if that version is not on npm yet)'
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # the same runner as the tests, so the build is the one the release was verified on
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@11.6.2
      - run: npm ci --ignore-scripts
      - name: The verified checksum, from the tag's message
        run: |
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then echo "::error::$TAG is not an annotated tag"; exit 1; fi
          lines=$(git tag -l --format='%(contents)' "$TAG" | grep -c '^package-sha256:' || true)
          if [ "$lines" != 1 ]; then echo "::error::the tag $TAG must have exactly one 'package-sha256:' line (it has $lines)"; exit 1; fi
          want=$(git tag -l --format='%(contents)' "$TAG" | sed -n 's/^package-sha256: *\([0-9a-f]\{64\}\) *$/\1/p')
          if [ -z "$want" ]; then echo "::error::the tag $TAG's 'package-sha256:' line is not 64 hex characters"; exit 1; fi
          echo "WANT=$want" >> "$GITHUB_ENV"
      - name: Build the package from the tagged tree
        run: |
          node --experimental-strip-types --no-warnings scripts/build-iso.ts dist-iso
          cd dist-iso && npm pack --silent --pack-destination .. > /dev/null && cd ..
          tgz=$(ls johnoscott-isometric-engine-*.tgz)
          name=$(node -p "require('./dist-iso/package.json').name"); version=$(node -p "require('./dist-iso/package.json').version")
          if [ "v$version" != "$TAG" ]; then echo "::error::the package is $version but the tag is $TAG"; exit 1; fi
          got=$(shasum -a 256 "$tgz" | cut -c1-64)
          echo "built $tgz: sha256 $got, sha1 $(shasum "$tgz" | cut -c1-40)"
          echo "TGZ=$tgz" >> "$GITHUB_ENV"; echo "PKG=$name@$version" >> "$GITHUB_ENV"
          if [ "$got" != "$WANT" ]; then echo "::error::built sha256 $got is not the verified $WANT: not publishing"; exit 1; fi
      - name: Publish (or, if already published, check against the registry)
        run: |
          have=$(npm view "$PKG" dist.shasum 2>/dev/null || true)
          if [ -n "$have" ]; then
            got=$(shasum "$TGZ" | cut -c1-40)
            if [ "$have" = "$got" ]; then echo "$PKG is already on npm and this build is byte-identical (sha1 $got): nothing to publish"; exit 0; fi
            echo "::error::$PKG is on npm with sha1 $have, but this build is $got"; exit 1
          fi
          npm publish "$TGZ" --provenance --access public
