      - { id: client-area, kind: tunnel, around: [ r7, r8 ], label: LISTENER, at: [ 15.25, 4.8 ], size: [ 1.5, 4.0 ], height: 0.8, z: 0.2 }
      - { id: index-area, kind: tunnel, around: [ r13 ], label: LISTENER, at: [ 17.6, -16.6 ], size: [ 0.8, 6.2 ], height: 0.8 }

