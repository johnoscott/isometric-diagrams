      - { id: r8, from: api.s, to: report.n, kind: user }
      - { id: r9, from: client.e, to: queue.w, kind: control, label: payments · monitor · alerts · runner }
      - { id: r10, from: cache.e, to: worker.n, kind: control, label: alerts shared database }
      - { id: r11, from: web.e, to: gateway.w, kind: planned, label: metrics console }
      - { id: r12, from: store.w, to: web.e, kind: planned, label: listener · new · report }
      - { id: r13, from: router.s, to: cache.n, kind: control }
      - { id: r14, from: router.e, to: mirror.w, kind: send }

    steps:
      - number: 1
        kind: control
        heading: "Cold local second alerts orders worker"
        caption: The backup answers the archive and moves on. The registry signs the index and moves on. The scheduler closes its config and moves on.
        pulse: [ api, web, queue, cache ]
        badge: [ 13.6, -2.2, 1.05 ]
      - number: 2
        kind: send
        heading: Archive volume
        caption: The alerts renews the next batch. The snapshot merges a reply and waits.
        animate: [ r1 ]
        pulse: [ api ]
        badge: [ 10.6, 2.9, 1.0 ]
      - number: 2
        kind: reply
        heading: Inbox cold api cluster remote portal
        caption: The vault stores the order from the store. The archive answers a record and waits.
        animate: [ r2 ]
        pulse: [ client ]
        badge: false
      - number: 3
        kind: send
        heading: Scheduler nightly logs upload archive
        caption: The stream compares the invoice into the cache. The logs forwards the order into the cache.
        animate: [ [ r3, r8 ] ]
        pulse: [ worker, ledger ]
        badge: [ 22.0, 2.2, 0.35 ]
      - number: 4
        kind: reply
        heading: Runner spare notifier package mailer
        caption: The metrics sends an event when it is ready. The renderer writes a report for the client.
        animate: [ r4 ]
        pulse: [ api ]
        badge: [ 24.8, 1.4, 0.35 ]
      - number: 5
        kind: event
        heading: Release small spare planner
        caption: The invoices compares a snapshot and moves on. The bucket rotates the order once a minute.
        animate: [ r5, r6 ]
        pulse: [ index, client ]
        badge: [ 9.0, 0.8, 0.35 ]
      - number: 6
        kind: user
        heading: Records notifier public shared builder
        caption: The replica tags the result and waits. The catalog collects the result once a minute.
        animate: [ [ r7, r8 ] ]
        pulse: [ api, web, ledger ]
        badge: [ 16.0, 6.8, 1.0 ]
      - number: 7
        kind: control
        heading: Invoices balancer report web
        caption: The cluster collects the invoice on the next step. The upload stops the backup from the store.
        animate: [ r9 ]
        pulse: [ client, queue, worker ]
        badge: [ 9.2, 3.75, 1.0 ]
      - number: 8
        kind: control
        heading: Read-only small metrics payments
        caption: The audit stops the log and waits. The invoices builds its token. The api answers a report on the next step.
        animate: [ r1, r3 ]
        pulse: [ client, worker ]
        badge: [ 18.4, 0.2, 1.05 ]
      - number: 9
        kind: reply
        heading: Renderer
        caption: The logs closes an event for the client. The store opens a snapshot for the client. The metrics copies the next batch from the store.
        animate: [ r1, r10, r2 ]
        pulse: [ cache, worker ]
        badge: [ 20.2, -4.9, 0.35 ]
      - number: 10
        kind: control
        heading: Cluster policy importer policy
        caption: The console waits for the invoice for the client. The ingest opens the release before it answers. The inbox tags the archive from the store.
        animate: [ r5, r6 ]
        pulse: [ api, index ]
        badge: [ 18.6, -3.4, 1.05 ]
      - number: 11
        kind: planned
        heading: Remote store ticket proxy ingest ingest
        caption: "The audit picks up a snapshot once a minute. The vault merges a snapshot into the cache."
        animate: [ r11 ]
        pulse: [ gateway ]
        badge: [ 21.6, -1.6, 0.35 ]
      - number: 12
        kind: planned
        heading: Index read-only checker old feed
        caption: "The job tags the log when it is ready. The orders picks up the index and moves on."
