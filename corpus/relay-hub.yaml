    after: |-
      The snapshot compares the index from the store. The snapshot checks a record. The scheduler compares the index. The ledger compares the archive. The gateway stores an event for the client. The tracer retries a record when it is ready. The checker picks up its token and waits. The invoices collects the invoice from the store. The mailer reads the release once a minute. The inbox merges the queue when it is ready. The router starts the invoice from the store. The payments publishes a record and waits. The scheduler copies the result before it answers. The catalog signs the index once a minute. The checker rotates the log when it is ready.
