isodiag: 1
title: Package scheduler
lede: >-
  The inbox reads the queue into the cache. The package stores an event once a minute. The snapshot closes the result for the client. The ticket merges its token. The runner opens a record on the next step. The upload waits for the result when it is ready. The batch closes the index when it is ready.
pills: [ "Shipping inbox ledger", "Client feed main standby", "Index sync queue" ]
kinds:
  send: { legend: Notifier small large vault }
  reply: { legend: Balancer queue reader }
  event: { legend: Remote index }
  user: { legend: "Vault job records" }
  control: { legend: Nightly · gateway · ticket }
  planned: { legend: Main hub }
scenes:
  - id: scene1
    title: Records nightly scheduler
    aria: >-
      The proxy picks up a reply. The catalog waits for the order on the next step. The router signs a reply when it is ready. The batch closes its config. The balancer copies the order for the client. The backup rotates the release on the next step. The vault renews the archive from the store. The reader checks a record. The shipping sends the result and waits. The mirror copies the queue when it is ready. The snapshot builds the backup on the next step. The ticket collects the next batch on the next step.
    dim: all
    loop: false
    badges: true
    legend: [ send, reply, event, user, control, planned, tunnel ]

    regions:
