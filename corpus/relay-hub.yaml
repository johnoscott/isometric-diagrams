      - { id: r2, from: api.w, to: client.e, kind: reply, label: client · internal · checker }
      - { id: r3, from: api.e, to: worker.w, kind: send, label: queue large stream queue }
      - { id: r4, from: worker.w, to: api.e, kind: reply, label: bucket read-only bucket inbox }
