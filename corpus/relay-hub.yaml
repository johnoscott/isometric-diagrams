            kind: platform
            label: TRACER METRICS
            at: [ 6.2, 1.8 ]
            size: [ 6.8, 13.4 ]
            height: 0.7
            nodes:
              - { id: api, asset: mailbox, at: [ 2.2, 9.6 ], label: "runner batch", sub: importer · feed · report · replica · bucket · feed }
              - { id: web, asset: mailbox, at: [ 2.2, 5.2 ], size: [ 2.4, 2.4, 1.2 ], label: local mirror, sub: api alerts }
              - { id: queue, asset: block, role: grey, at: [ 2.2, 0.8 ], size: [ 2.4, 2.0, 0.6 ], deco: [ { terminal: 1 } ], label: writer, sub: registry · remote · writer · parser }
              - { id: cache, asset: block, role: event, at: [ 5.0, 1.0 ], size: [ 1.5, 1.6, 0.5 ], label: shipping, sub: exporter }
          - id: queue-area
            kind: vm
            role: belt
            label-style: none
            at: [ 19.6, 0.6 ]
            size: [ 4.6, 4.4 ]
            height: 0.25
            nodes:
              - { id: store, asset: session, role: violet, at: [ 1.2, 1.0 ], size: [ 2.4, 2.4, 1.6 ], deco: [ { terminal: 3 } ], label: Old invoices, sub: service · cold · cold · hub }
        nodes:
          - { id: worker, asset: session, role: violet, at: [ 20.8, 11.4 ], size: [ 2.4, 2.4, 2.0 ], label: Old invoices, sub: "relay · report · planner · main · scheduler" }
          - { id: gateway, asset: session, role: violet, ghost: true, at: [ 20.8, 7.0 ], size: [ 2.4, 2.4, 1.5 ], deco: [ { terminal: 3 } ], label: Old invoices, sub: notifier }
      - id: cache-area
        kind: pad
        at: [ -2.2, -0.6 ]
        size: [ 7.8, 5.0 ]
        nodes:
          - { id: client, asset: orb, at: [ 1.45, 1.85 ], label: Metrics, sub: Router · job · checker · runner · policy · snapshot }
          - { id: index, asset: block, role: event, at: [ 5.6, 0.6 ], size: [ 1.6, 1.6, 0.8 ], label: records, sub: ingest writer }
      - id: store-area
        kind: pad
        at: [ 11.4, 8.8 ]
        size: [ 8.6, 6.0 ]
        nodes:
          - { id: ledger, asset: person, at: [ 3.45, 3.65 ], label: Report, sub: shared · volume · large · hub }
          - { id: report, asset: screen, face: chat, facing: -6, at: [ 3.066, 1.266 ], label: backup, sub: "mirror store" }
          - { id: builder, asset: screen, face: desktop, facing: -52, at: [ 1.016, 2.403 ], label: policy ingest, sub: alerts }
      - id: worker-area
        kind: slab
        label: payments
        at: [ 16, -24 ]
        size: [ 14, 7.4 ]
