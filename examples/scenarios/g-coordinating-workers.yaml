          - { id: api, asset: session, role: lead, label: primary, sub: "Router · orders · store · queue · catalog" }
          - { id: web, asset: session, role: work, right-of: api, gap: 5, label: inbox, sub: registry importer queue }
          - { id: queue, asset: session, role: work, below: web, gap: 4.5, label: metrics, sub: service queue relay bucket }
