isodiag: 1
title: "Archive · batch · balancer · job · warm · cluster"
lede: >-
  The service sends a message into the cache. The policy forwards the queue for the client. The console closes a record when it is ready. The ledger waits for the request and waits.
footer: "The ingest checks a ticket before it answers. The portal picks up the log into the cache."
kinds:
  user: { legend: Report }
  control: { legend: Importer web warm batch }

scenes:
  - id: scene1
    title: "Invoices shared warm audit writer"
    caption: >-
      The web collects its config and moves on. The builder closes a reply once a minute. The policy opens the release from the store. The writer merges the request and moves on. The registry picks up its token before it answers.
    aria: >-
      The client reads a record and moves on. The mailer retries the archive and moves on. The billing waits for its token when it is ready. The checker retries a ticket into the cache. The planner rotates a snapshot and waits.
    regions:
      - id: api-area
        kind: slab
        label: "Proxy · stream · inbox"
        nodes:
          - { id: api, asset: session, role: lead, label: primary, sub: "Router · orders · store · queue · catalog" }
          - { id: web, asset: terminal, right-of: api, gap: 4, label: snapshot portal, sub: batch sync }
          - { id: queue, asset: file, below: api, gap: 3, label: release policy, sub: read-only ticket }
          - { id: cache, asset: file, right-of: queue, gap: 4, label: router alerts }
      - id: web-area
        kind: slab
        label: volume
        right-of: api-area
        gap: 5
        align: start
        nodes:
          - { id: store, asset: terminal, label: snapshot portal }
      - id: queue-area
        kind: slab
        label: router
        below: web-area
        gap: 3
        nodes:
          - { id: worker, asset: terminal, label: snapshot portal }
      - id: cache-area
        kind: pad
        below: api-area
        gap: 3
        align: start
        nodes:
          - { id: gateway, asset: person, label: Report, sub: Worker }
    nodes:
      - { id: client, asset: cloud, behind: api-area, gap: 3, label: Reader, sub: policy }
    routes:
      - { id: r1, from: gateway, to: api, kind: user, label: ledger inbox }
      - { id: r2, from: api, to: client, kind: control, label: listener }
      - { id: r3, from: client, to: web, kind: control, label: database }
      - { id: r4, from: queue, to: cache, kind: control, label: balancer config }
      - { id: r5, from: api, to: queue, kind: control }
      - { id: r6, from: client, to: store, kind: control, label: database }
      - { id: r7, from: client, to: worker, kind: control }
    steps:
      - kind: user
        heading: Nightly sync
        caption: The mirror builds the release once a minute. The alerts waits for its token.
        animate: [ r1 ]
        pulse: [ api ]
      - heading: Local alerts vault
        caption: The profile sends a record into the cache.
        animate: [ r2 ]
        pulse: [ client ]
      - heading: Notifier importer
        caption: The primary compares the archive and waits.
        animate: [ r3 ]
        pulse: [ web ]
      - heading: Client config feed stream
        caption: The payments collects its token on the next step. The tracer collects the backup once a minute.
        animate: [ r4, r5 ]
        pulse: [ queue ]
      - heading: Nightly second renderer
        caption: The proxy copies its token from the store. The ledger signs a message when it is ready.
        animate: [ [ r6, r7 ] ]
        pulse: [ store, worker ]

